# Discord Bot N개 통합 데모 설정
#
# 사용법:
#   1. Discord Developer Portal에서 앱 생성 → Bot 토큰 발급
#   2. 각 봇을 원하는 서버에 초대 (Bot 토큰 필요)
#   3. 환경변수에 토큰 설정 (예: .env 파일 또는 셸 export):
#        BOT_TOKEN_AGENT_1=xxxxx
#        BOT_TOKEN_AGENT_2=xxxxx
#        BOT_TOKEN_AGENT_3=xxxxx
#        BOT_TOKEN_AGENT_4=xxxxx
#   4. 채널 ID 확인 (Discord 개발자 모드 → 채널 우클릭 → ID 복사)
#   5. 실행:
#        agent-augury --config examples/multi_bot_demo.yaml
#
# 참고: 봇 토큰은 환경변수에서 읽으므로 YAML에는 env 이름만 기록합니다.
#       실제 토큰은 .env 파일(또는 셸 환경)에 두고, 절대 git에 커밋하지 마세요.

mode: L3
max_steps: 10
task: "Multi-agent collaboration with Discord bot mirroring"

agents:
  - id: agent-1
    backend:
      type: fake
      script:
        - "I'll start by exploring the problem."
        - "Let me read the source code."
        - "I have a proposal."

  - id: agent-2
    backend:
      type: fake
      script:
        - "I'll review the proposal."
        - "Looks good, let's proceed."

  - id: agent-3
    backend:
      type: fake
      script:
        - "I'll refine the design."
        - "Let's draft the implementation plan."

  - id: agent-4
    backend:
      type: fake
      script:
        - "I'll handle QA and edge cases."
        - "Everything checks out."

# Discord 봇 N개 통합 설정
# 각 봇은 agent_id에 바인딩되어 해당 에이전트의 이벤트만 전송합니다.
# token_env: 환경변수 이름 (실제 토큰은 .env 파일에 두고 git 추적 금지)
bots:
  - agent_id: agent-1
    token_env: BOT_TOKEN_AGENT_1
    channel_id: 1526401014536867853

  - agent_id: agent-2
    token_env: BOT_TOKEN_AGENT_2
    channel_id: 1526401014536867853

  - agent_id: agent-3
    token_env: BOT_TOKEN_AGENT_3
    channel_id: 1526401014536867853

  - agent_id: agent-4
    token_env: BOT_TOKEN_AGENT_4
    channel_id: 1526401014536867853
