# agent-augury v0.3 — P1~P5 full collaboration protocol (YAML)
#
# Needs a real model (OPENAI_API_KEY, or change the backends):
#   agent-augury --config examples/p1_to_p5_protocol.yaml
#
# The scripted, offline version (every message pre-written) is the test
# fixture tests/fixtures/p1_to_p5_scripted.yaml, run by
# tests/test_integration_openai.py.

max_steps: 50
protocol:
  participants:
  - agent-1
  - agent-2
  - agent-3
  roster:
    start: -1   # full pool — all three agents
  gates:
    P2_SPLIT: plan
    P3_EXECUTE: execution
    P4_REVIEW: review
    P5_SUBMIT: submission
agents:
- id: agent-1
  backend:
    type: openai
    model: gpt-4o-mini
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
- id: agent-2
  backend:
    type: openai
    model: gpt-4o-mini
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
- id: agent-3
  backend:
    type: openai
    model: gpt-4o-mini
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
