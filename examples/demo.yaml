# agent-augury demo session
#
# Needs a real model (OPENAI_API_KEY, or change the backends):
#   agent-augury --config examples/demo.yaml   # Ink Surface (default)
#
# Idea: agent-2 opens a thread and pushes an URGENT correction; agent-1 is
# mid-work, absorbs it passively as a [radio] turn at the next step boundary,
# and answers — without ever blocking on a receive. (The scripted, offline
# version of this flow is the test fixture tests/fixtures/demo_scripted.yaml.)

task: "42가 아니라 진짜 답을 찾아라"
max_steps: 12

agents:
  - id: agent-1
    backend:
      type: openai
      model: gpt-4o-mini
      base_url: https://api.openai.com/v1
      api_key_env: OPENAI_API_KEY

  - id: agent-2
    backend:
      type: openai
      model: gpt-4o-mini
      base_url: https://api.openai.com/v1
      api_key_env: OPENAI_API_KEY
