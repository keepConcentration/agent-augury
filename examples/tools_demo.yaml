# agent-augury — 신규 도구(run_command/fetch_url/edit_file 등) 데모 설정
#
# 사용법:
#   agent-augury --config examples/tools_demo.yaml   # OPENAI_API_KEY 필요
#
# 이 설정은 agent-1 에게 셸·파일 도구를 모두 노출합니다. 모델이
# run_command·read_file·list_directory·edit_file·append_file 을 부르면
# 로그에서 각 도구의 실제 실행 결과(exit_code, stdout 등)를 확인할 수 있습니다.
# 도구 호출은 tools.approval 기본값대로 사람 승인을 거칠 수 있습니다.

task: "셸 도구와 파일 도구가 실제로 동작하는지 데모를 수행하라"
max_steps: 8

# tools: 섹션은 생략 가능 — 기본 활성화(D3)로 신규 도구가 모두 노출됩니다.
# 명시적으로 끄려면 예: tools.shell.enabled: false
# tools:
#   shell:
#     enabled: true
#   web:
#     enabled: true

agents:
  - id: agent-1
    backend:
      type: openai
      model: gpt-4o-mini
      base_url: https://api.openai.com/v1
      api_key_env: OPENAI_API_KEY
