                content: 'APPROVE: ok'
                mentions: []
        - tool_calls:
            - name: send_message
              arguments:
                thread: $thread_by_name:execution
                content: '(FYI) agent-2 검증 완료'
                mentions: []
        - tool_calls:
            - name: send_message
              arguments:
                thread: $thread_by_name:execution
                content: 'APPROVE: ok'
                mentions: []
        - tool_calls:
            - name: send_message
              arguments:
                thread: $thread_by_name:review
                content: 'RESULT: 완료'
                mentions: []
        - tool_calls:
            - name: send_message
              arguments:
                thread: $thread_by_name:review
                content: 'APPROVE: ok'
                mentions: []
        - text: waiting for final
        - tool_calls:
            - name: send_message
              arguments:
                thread: $thread_by_name:submission
                content: 'APPROVE: ok'
                mentions: []
        - text: done
    # per-agent override 없음 → 전역 설정 상속

