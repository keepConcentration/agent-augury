[project]
name = "agent-augury"
version = "0.7.6"
description = "Local multi-agent collaboration runtime — shared threads, roles, HITL, model-agnostic backends."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "agent-augury contributors" }]
keywords = ["multi-agent", "llm", "collaboration", "asyncio", "hitl"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Communications :: Chat",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "httpx>=0.27",
    "PyYAML>=6.0",
    "aiosqlite>=0.20",
    "py-cord>=2.6",
    "python-dotenv>=1.0",
    "rich>=13.0",
]

[project.urls]
Repository = "https://github.com/keepConcentration/agent-augury"
Homepage = "https://github.com/keepConcentration/agent-augury"
Documentation = "https://github.com/keepConcentration/agent-augury#readme"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[project.scripts]
agent-augury = "agent_augury.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_augury"]

# B: ship Ink front sources in the wheel (no node_modules — first run caches + npm install).
[tool.hatch.build.targets.wheel.force-include]
"fronts/ink/package.json" = "agent_augury/fronts/ink/package.json"
"fronts/ink/package-lock.json" = "agent_augury/fronts/ink/package-lock.json"
"fronts/ink/tsconfig.json" = "agent_augury/fronts/ink/tsconfig.json"
"fronts/ink/README.md" = "agent_augury/fronts/ink/README.md"
"fronts/ink/src" = "agent_augury/fronts/ink/src"

# Ensure sdist retains fronts/ink so wheel force-include can resolve after sdist→wheel.
[tool.hatch.build.targets.sdist.force-include]
"fronts/ink/package.json" = "fronts/ink/package.json"
"fronts/ink/package-lock.json" = "fronts/ink/package-lock.json"
"fronts/ink/tsconfig.json" = "fronts/ink/tsconfig.json"
"fronts/ink/README.md" = "fronts/ink/README.md"
"fronts/ink/src" = "fronts/ink/src"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "openai: opt-in tests requiring AUGURY_RUN_OPENAI_TESTS=1 and OPENAI_API_KEY",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
