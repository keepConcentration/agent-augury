# TUI demo config — fake backend with ask_user
#
# Run with:
#   agent-augury --config examples/human_tui_demo.yaml --interactive --demo
#
# The fake backend scripts an agent that:
#   1. Creates a thread
#   2. Calls ask_user (question + options)
#   3. Receives the human reply via [radio] and produces a final answer
#
# In TUI mode (human.interface: tui), the ask_user question is pinned to the
# bottom toolbar and the user can respond by typing the option number.

max_steps: 20
task: "DB 선택을 확인해줘"

agents:
  - id: agent-1
    backend:
      type: fake
      script:
        - tool_calls:
            - name: create_thread
              arguments:
                name: work
                participants: ["agent-1"]
            - name: ask_user
              arguments:
                thread: "$thread:0"
                question: "어떤 DB를 사용할까요?"
                options:
                  - "PostgreSQL"
                  - "MySQL"
                  - "SQLite"
        - "DB 선택이 완료됐습니다. 감사합니다!"
